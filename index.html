<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Simulateur de notes BFI Trilingue</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
font-family:Inter,Arial;
background:linear-gradient(135deg,#eef2ff,#f8fafc);
margin:0;
padding:30px;
}

h1{text-align:center;margin-bottom:5px}
.subtitle{text-align:center;color:#666;margin-bottom:20px}

.container{
max-width:1100px;
margin:auto;
}

.mode{
text-align:center;
margin-bottom:25px;
}

.sections{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:14px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.card h2{
margin-top:0;
font-size:18px;
margin-bottom:15px;
}

.grid{
display:grid;
grid-template-columns:1fr 70px 70px;
gap:8px;
align-items:center;
margin-bottom:8px;
}

.header{
font-weight:600;
font-size:14px;
color:#555;
}

input{
padding:5px;
border-radius:6px;
border:1px solid #ddd;
width:60px;
}

select{
padding:6px;
border-radius:6px;
border:1px solid #ddd;
}

.result{
margin-top:30px;
background:#eef2ff;
padding:20px;
border-radius:12px;
text-align:center;
font-size:22px;
font-weight:600;
}

.details{
text-align:center;
margin-top:8px;
color:#555;
}

@media (max-width:900px){
.sections{
grid-template-columns:1fr;
}
}

</style>
</head>

<body>

<div class="container">

<h1>Simulateur de notes BFI Trilingue</h1>
<p class="subtitle">Ajustez les coefficients selon l'option facultative suivie.</p>

<div class="mode">
<label><b>Options :</b></label>
<select id="modeOptions" onchange="toggleOptions()">
<option value="sans">Sans options</option>
<option value="avec">Avec options</option>
</select>
</div>

<div class="sections" id="sections"></div>

<div class="result" id="result">Entre tes notes pour voir ta moyenne</div>
<div class="details" id="details"></div>

</div>

<script>

const structure=[

{
titre:"Épreuves finales",
matieres:[
{nom:"Français oral",coeff:5,type:"final"},
{nom:"Français écrit",coeff:5,type:"final"},
{nom:"Philosophie",coeff:8,type:"final"},
{nom:"Grand oral",coeff:10,type:"final"},
{nom:"Spécialité 1",coeff:16,type:"final"},
{nom:"Spécialité 2",coeff:16,type:"final"},
{nom:"EPS",coeff:6,type:"cc"}
]
},

{
titre:"Épreuves BFI",
matieres:[
{nom:"ACL oral",coeff:10,type:"final"},
{nom:"ACL écrit",coeff:10,type:"final"},
{nom:"Histoire-Géo oral",coeff:10,type:"final"},
{nom:"Histoire-Géo écrit",coeff:10,type:"final"},
{nom:"Connaissance du monde",coeff:20,type:"final"}
]
},

{
titre:"Tronc commun Première",
matieres:[
{nom:"Spécialité abandonnée",coeff:8,type:"cc"},
{nom:"Arabe LVA",coeff:3,type:"cc"},
{nom:"LVB",coeff:3,type:"cc"},
{nom:"LVB",coeff:2,type:"cc"},
{nom:"Enseignement scientifique",coeff:3,type:"cc"},
{nom:"EMC",coeff:1,type:"cc"}
]
},

{
titre:"Tronc commun Terminale",
matieres:[
{nom:"LVA",coeff:3,type:"cc"},
{nom:"LVB",coeff:3,type:"cc"},
{nom:"LVB",coeff:2,type:"cc"},
{nom:"Enseignement scientifique",coeff:3,type:"cc"},
{nom:"EMC",coeff:1,type:"cc"}
]
},

{
titre:"Options",
id:"optionsSection",
matieres:[
{nom:"Maths Expertes",coeff:2,type:"cc"},
{nom:"DGEMC",coeff:2,type:"cc"}
]
}

]

let flat=[]

function render(){

const container=document.getElementById("sections")
container.innerHTML=""
flat=[]

structure.forEach(section=>{

const card=document.createElement("div")
card.className="card"

if(section.id){
card.id=section.id
}

let html=`<h2>${section.titre}</h2>
<div class="grid header">
<div>Matière</div>
<div>Note</div>
<div>Coeff</div>
</div>`

section.matieres.forEach(m=>{

const index=flat.length
flat.push(m)

html+=`
<div class="grid">
<div>${m.nom}</div>
<input type="number" id="note${index}" min="0" max="20" step="0.01" oninput="calcul()">
<input type="number" id="coeff${index}" value="${m.coeff}" oninput="calcul()">
</div>`

})

card.innerHTML=html
container.appendChild(card)

})

}

function calcul(){

let total=0
let coeffTotal=0

let totalFinal=0
let coeffFinal=0

let totalCC=0
let coeffCC=0

flat.forEach((m,i)=>{

let note=parseFloat(document.getElementById("note"+i)?.value)
let coeff=parseFloat(document.getElementById("coeff"+i)?.value)

if(!isNaN(note) && !isNaN(coeff)){

 total+=note*coeff
 coeffTotal+=coeff

 if(m.type==="final"){
 totalFinal+=note*coeff
 coeffFinal+=coeff
 }

 if(m.type==="cc"){
 totalCC+=note*coeff
 coeffCC+=coeff
 }

}

})

if(coeffTotal===0) return

let moyenne=total/coeffTotal

let mention=""

if(moyenne>=18) mention="Mention Très Bien avec félicitations du jury"
else if(moyenne>=16) mention="Mention Très Bien"
else if(moyenne>=14) mention="Mention Bien"
else if(moyenne>=12) mention="Mention Assez Bien"
else if(moyenne>=10) mention="Admis"
else mention="Ajourné"

let moyenneFinal=coeffFinal? (totalFinal/coeffFinal).toFixed(2):"-"
let moyenneCC=coeffCC? (totalCC/coeffCC).toFixed(2):"-"

document.getElementById("result").innerText=
`Moyenne estimée : ${moyenne.toFixed(2)} /20 — ${mention}`

document.getElementById("details").innerText=
`Épreuves finales : ${moyenneFinal}  |  Contrôle continu : ${moyenneCC}`

}

function toggleOptions(){

const mode=document.getElementById("modeOptions").value
const options=document.getElementById("optionsSection")

if(!options) return

if(mode==="sans"){
options.style.display="none"
}else{
options.style.display="block"
}

calcul()

}

render()
toggleOptions()

</script>

</body>

</html>
